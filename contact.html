<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToolsWebsiteAI</title>
    <meta name="description" content="Get in touch with ToolsWebsiteAI support team for queries, feedback, and partnerships.">
    <link rel="canonical" href="https://toolswebsiteai.github.io/contact.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-extrabold text-lg">ToolsWebsite<span class="text-sky-500">AI</span></a>
            <a href="index.html" class="text-xs text-sky-400 hover:underline">← Back to Home</a>
        </div>
    </header>
    <main class="max-w-2xl mx-auto px-4 py-12 w-full space-y-6">
        <h1 class="text-2xl sm:text-3xl font-black">Contact Us</h1>
        <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">Have questions about our AI tools or need assistance? Reach out to us using the form below or drop an email.</p>
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 text-xs">
            <div>
                <label class="block font-bold mb-1 text-slate-300">Your Name</label>
                <input type="text" placeholder="Enter your name" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block font-bold mb-1 text-slate-300">Email Address</label>
                <input type="email" placeholder="name@example.com" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block font-bold mb-1 text-slate-300">Message</label>
                <textarea rows="4" placeholder="How can we help you?" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500"></textarea>
            </div>
            <button onclick="alert('Message sent successfully!')" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition">Send Message</button>
        </div>
    </main>
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 ToolsWebsiteAI.github.io. All rights reserved.</p>
    </footer>
</body>
</html>
